name: Build NOOR 3D Icon Pack APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o Noor3DIconPack.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: Noor3DIconPack
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor3D-APK
          path: Noor3DIconPack/app/build/outputs/apk/debug/app-debug.apk
